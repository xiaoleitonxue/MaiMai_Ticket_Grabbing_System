<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - MaiMai抢票系统</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      top: -200px; right: -100px;
      border-radius: 50%;
    }
    .login-page::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      border-radius: 50%;
    }
    .login-card {
      position: relative; z-index: 1;
      background: rgba(30,41,59,0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    }
    .login-logo {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 8px;
    }
    .login-logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .login-logo-text {
      font-size: 28px; font-weight: 800; color: var(--white);
    }
    .login-subtitle { text-align: center; color: var(--gray-400); font-size: 14px; margin-bottom: 32px; }
    .login-card .form-label { color: var(--gray-300); }
    .login-card .form-input {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.1);
      color: var(--white);
      padding: 12px 16px;
    }
    .login-card .form-input:focus { border-color: var(--primary); background: rgba(255,255,255,0.08); }
    .login-card .form-input::placeholder { color: var(--gray-500); }
    .login-options { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .login-remember { display: flex; align-items: center; gap: 6px; color: var(--gray-400); font-size: 13px; cursor: pointer; }
    .login-remember input { accent-color: var(--primary); }
    .login-error { color: var(--danger); font-size: 13px; text-align: center; margin-bottom: 16px; min-height: 20px; }
    .login-tip { text-align: center; color: var(--gray-500); font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🎫</div>
      <span class="login-logo-text">MaiMai</span>
    </div>
    <p class="login-subtitle">抢票系统 · 用户登录</p>

    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" class="form-input" id="username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>

    <div class="login-options">
      <label class="login-remember">
        <input type="checkbox" id="rememberMe"> 记住我
      </label>
    </div>

    <div class="login-error" id="loginError"></div>

    <button class="btn btn-primary btn-block btn-lg" id="loginBtn" onclick="handleLogin()">
      登 录
    </button>

    <p class="login-tip">没有账号？请联系管理员</p>
  </div>
</div>

<script src="js/axios.min.js"></script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
  // 回车登录
  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('username').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });

  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const rememberMe = document.getElementById('rememberMe').checked;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    if (!username) { errorEl.textContent = '请输入用户名'; return; }
    if (!password) { errorEl.textContent = '请输入密码'; return; }

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
      // 直接调用axios，因为api.user.login的响应拦截器会解包R
      const res = await api.user.login(username, password, rememberMe);
      const data = res.data;
      if (data && data.token) {
        sessionStorage.setItem('token', data.token);
        sessionStorage.setItem('user-info', JSON.stringify({
          userId: data.userId,
          username: data.username,
          balance: data.balance
        }));
        var redirectUrl = sessionStorage.getItem('login-redirect');
        if (redirectUrl) {
          sessionStorage.removeItem('login-redirect');
          location.href = redirectUrl;
        } else {
          location.href = '/index.html';
        }
      } else {
        errorEl.textContent = '登录失败，请检查用户名和密码';
      }
    } catch (err) {
      errorEl.textContent = err.response?.data?.msg || '登录失败，请稍后重试';
    } finally {
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  }
</script>
</body>
</html>
